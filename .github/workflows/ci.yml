name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端验收测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: 安装依赖
        run: uv sync --project backend
      - name: 验收测试（59 项）
        run: uv run --project backend pytest tests/backend -q
      - name: Lint（错误级）
        run: uv run --project backend --with ruff ruff check backend --select E9,F63,F7,F82

  determinism:
    name: 确定性承诺
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: 安装依赖
        run: uv sync --project backend
      - name: 重跑数据生成器 → 断言与仓库内数据逐字节一致
        run: |
          uv run --project backend python scripts/generate_demo_data.py
          git diff --exit-code data/demo/market_prices.csv data/demo/macro.csv data/demo/erp_inputs.csv
      - name: 同一 as-of 重放两次 → 断言 decision_id 与目标权重完全一致
        run: |
          uv run --project backend python - <<'EOF'
          import sys; sys.path.insert(0, "backend")
          from app.domain.pipeline import run_decision
          from app.schemas.config import AllocationConfig
          cfg = AllocationConfig()
          a = run_decision("ci", "2026-07-09", cfg)
          b = run_decision("ci", "2026-07-09", cfg)
          assert a.decision_id == b.decision_id, "决策 ID 不确定"
          assert a.target_weights == b.target_weights, "目标权重不确定"
          assert a.input_fingerprint == b.input_fingerprint, "输入指纹不确定"
          print("determinism OK:", a.decision_id)
          EOF

  frontend:
    name: 前端构建与交互测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: |
          uv sync --project backend
          cd frontend && npm ci
      - name: 类型检查与构建
        run: cd frontend && npm run build
      - name: 安装 Playwright 浏览器
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Playwright 交互测试（webServer 自动拉起前后端）
        run: cd frontend && npx playwright test --reporter=line
